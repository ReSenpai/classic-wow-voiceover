# Словарь произношения (дизайн §6). «+» — перед ударной гласной; «ё» пишется явно.
# Без respell: true запись может только добавить «+» и «ё» к исходному написанию.
# Ударения в игровых именах ставит только человек после прослушивания — не угадывать.
#
# - written: <как в игровом тексте>
#   spoken: <с «+» и «ё»>
#   source: <откуда решение: ё-словарь / ревью пилота / вики и т.п.>
#   note: <контекст, омографы, история правок>
- written: еще
  spoken: ещё
  source: ё-словарь (однозначное слово)
- written: ее
  spoken: её
  source: ё-словарь (однозначное слово)
