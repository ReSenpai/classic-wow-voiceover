  source_sha256: 71aaf7152eea87d182a64b7d90788ce79d6f103a69c90fabb6eac355a1703b3b
  reason: раса $r внутри фразы; решение пользователя 11.10.2026
  text: |-
    Ха-ха! Хорошая работенка!$B$BКто бы мог подумать, что на меня, Зенна Грязное Копыто, будет работать такой, как ты? Я даже мечтать об этом не мог! Но раз уж так вышло... Наш милый мир полон неожиданностей.$B$BОбманули дурака на четыре кулака!
- key: quest:489:accept
  source_sha256: 95bfadcdc7de1b34c4b658bc4651895a1a2378c0405205ff7d16ab1752706668
  reason: раса $r внутри фразы; решение пользователя 11.10.2026
  text: |-
    Совет Леса узнал, что ты $Gпомог:помогла; Зенну Грязному Копыту! Этот сатир – враг леса! И ты $Gдолжен бы:должна бы; понимать, что оскверняешь лес, убивая созданий Природы!$B$BТы $Gдолжен:должна; искупить свою вину перед Советом, если хочешь оставаться другом Тельдрассилу! $B$BПреподай Грязному Копыту урок – и заслужишь прощение. Есть такие шишки Скверны – это семена, падающие с деревьев. Они испускают зеленый дым.$B$BСкорми несколько штук Грязному Копыту. Он подумает, что ему предлагают что-то вкусненькое.
- key: quest:933:complete
  source_sha256: 62d5b3668f7c2738f423726ec2c0362e084e361dbcc33a60752d16084821b6ae
  reason: 'ошибка локализации: $c вместо «друид» (Archdruid Fandral); решение пользователя 11.10.2026'
  text: |-
    Шан'до Ярость Бури так и не вернулся, и новостей про него до сих пор не поступало. Друиды были в смятении. После пропажи Малфуриона верховный друид Фэндрал Олений Шлем взял на себя руководство друидами, убедив Круг Древних на Темных берегах, что нашему народу пора снова заполучить былую мощь и бессмертие.

    С одобрения Круга Олений Шлем и самые могучие друиды вырастили Тельдрассил, новое Древо Жизни.
