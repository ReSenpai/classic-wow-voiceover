  - voice_id: satyr-male
    revision: "10"
    reference_audio: "voice_refs/satyr-male.wav"
    reference_text: "Хе-хе... Ну что ты, дружок, не бойся, я всегда держу своё слово. А за маленькую услугу получишь то, о чём другие только шепчутся."
    provenance: "Qwen3-TTS VoiceDesign Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign@5ecdb67327fd37bb2e042aab12ff7391903235d3, seed 49540858 (батч 49540857, №2 из 8), 2026-10-12; описание: A male fantasy satyr speaking fluent, natural Russian. A medium-low voice with a coarse, throaty rasp, dark resonance, and a faint animalistic edge. Lean and wiry in vocal character, with tightly controlled breath and occasional guttural undertones. The delivery is sly, mocking, and maliciously playful. He sounds like an ancient forest trickster corrupted by demonic magic, enjoying every opportunity to tempt, deceive, or unsettle the listener. Even friendly words carry a concealed threat. Use intimate, conspiratorial phrasing, deliberate pauses, and slightly elongated vowels when teasing or making an offer. Let certain phrases end in a dry, sneering chuckle. Brief snorts and a subtle goat-like catch in the throat may appear during laughter, but avoid literal bleating. When anger breaks through, shift abruptly from silky mockery into a harsh, snarling bark. Increase vocal tension and roughness while keeping every word intelligible. His menace comes from cunning and unpredictability as much as aggression. Natural Russian pronunciation with clear consonants and expressive, conversational phrasing. Close, dry studio recording. Keep the supernatural character in the performance itself. Avoid an excessively deep demon bass, a heroic warrior tone, constant growling, cartoonish goat noises, exaggerated hissing, heavy reverb, layered voices, or electronic distortion.; паузы длиннее 0.25 с сжаты до 0.25 с, края подрезаны (12.32 с → 10.65 с, F5 читает не больше 12 с)"
    license: "Apache-2.0 (модель Qwen3-TTS); голос сгенерирован проектом"
    sex: male
    recordings: satyr-male  # реплики записал автор проекта → seed-vc в тембр референса (<work>/recordings/)
    description: >-
      Сатир из фэнтези: средне-низкий голос с грубой гортанной хрипотцой, тёмным резонансом и лёгкой
      звериной ноткой. Хитрый, насмешливый, злорадно-игривый древний лесной трикстер, испорченный демонической
      магией; даже дружелюбные слова несут скрытую угрозу. Вкрадчивые паузы, растянутые гласные, сухой
      смешок, лёгкое «козлиное» придыхание в смехе (без блеяния); в гневе — резкий хриплый рык.
      Избегать: демонического баса, геройского тона, постоянного рычания, мультяшных звуков, эффектов.
      (описание пользователя 12.10.2026)
    design_prompt: >-
      A male fantasy satyr speaking fluent, natural Russian. A medium-low voice with a coarse, throaty rasp,
      dark resonance, and a faint animalistic edge. Lean and wiry in vocal character, with tightly controlled
      breath and occasional guttural undertones.
      The delivery is sly, mocking, and maliciously playful. He sounds like an ancient forest trickster
      corrupted by demonic magic, enjoying every opportunity to tempt, deceive, or unsettle the listener. Even
      friendly words carry a concealed threat.
      Use intimate, conspiratorial phrasing, deliberate pauses, and slightly elongated vowels when teasing or
      making an offer. Let certain phrases end in a dry, sneering chuckle. Brief snorts and a subtle goat-like
      catch in the throat may appear during laughter, but avoid literal bleating.
      When anger breaks through, shift abruptly from silky mockery into a harsh, snarling bark. Increase vocal
      tension and roughness while keeping every word intelligible. His menace comes from cunning and
      unpredictability as much as aggression.
      Natural Russian pronunciation with clear consonants and expressive, conversational phrasing. Close, dry
      studio recording. Keep the supernatural character in the performance itself.
      Avoid an excessively deep demon bass, a heroic warrior tone, constant growling, cartoonish goat noises,
      exaggerated hissing, heavy reverb, layered voices, or electronic distortion.
    test_lines:  # насмешливые, не из корпуса; смешок в начале — чтобы F5 перенимал его на «хе-хе» в репликах
      - Хе-хе... Ну что ты, дружок, не бойся, я всегда держу своё слово.
      - А за маленькую услугу получишь то, о чём другие только шепчутся.

