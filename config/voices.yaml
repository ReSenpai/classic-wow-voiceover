# Реестр голосов и кастинг (дизайн §7). Пилот: Тельдрассил + смоук Тенистой долины.
# Референсы создаются через Qwen3-TTS VoiceDesign (python -m voru.casting.design) и
# выбираются на слух. У голоса с reference_audio обязательны reference_text
# (точный транскрипт), provenance и license.
#
# Поля голоса: voice_id, revision (поднимать при смене референса/параметров — пересинтез),
# sex (male/female/any), description (для людей), design_prompt (для VoiceDesign, англ.),
# seed (по умолчанию — из voice_id), params: {провайдер: {...}},
# reference_audio (путь от этой папки), reference_text, provenance, license,
# test_lines — из них синтезируется референс: 2 предложения, ≤12 с (F5 обрезает длиннее), без игровых имён.

voices:
  - voice_id: nightelf-male-calm
    revision: "2"
    reference_audio: "voice_refs/nightelf-male-calm.wav"
    reference_text: "Пусть луна осветит твой путь, странник. Лес неспокоен в последние дни, и мы не знаем, что тому причиной."
    provenance: "Qwen3-TTS VoiceDesign Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign@5ecdb67327fd37bb2e042aab12ff7391903235d3, seed 2071980, 2026-10-11"
    license: "Apache-2.0 (модель Qwen3-TTS); голос сгенерирован проектом"
    sex: male
    description: Взрослый ночной эльф, спокойный, ровный, негромкий; базовый мужской голос расы.
    design_prompt: Adult male night elf, calm and even, soft-spoken baritone, measured pace, warm but reserved.
    test_lines:
      - Пусть луна осветит твой путь, странник.
      - Лес неспокоен в последние дни, и мы не знаем, что тому причиной.

  - voice_id: nightelf-male-elder
    revision: "1"
    sex: male
    description: Пожилой друид, глубокий тембр, неторопливо, с весом и лёгкой усталостью.
    design_prompt: Elderly male druid, deep resonant bass voice, slow and deliberate, wise, slightly weary.
    test_lines:
      - Мы долго спали, но лес помнит всё, что с ним случилось.
      - Старые корни болят, когда в землю приходит зло.

  - voice_id: nightelf-female-calm
    revision: "1"
    sex: female
    description: Взрослая ночная эльфийка, тёплая, сдержанная; базовый женский голос расы.
    design_prompt: Adult female night elf, warm and composed alto voice, gentle, calm pace.
    test_lines:
      - Будь осторожен в лесу, не все его обитатели дружелюбны.
      - Я буду ждать тебя здесь, у ручья.

  - voice_id: nightelf-female-sentinel
    revision: "1"
    sex: female
    description: Часовая-воительница, взрослая, закалённая в боях; низкий твёрдый голос, приказной тон, без «девчачести».
    design_prompt: Adult female warrior, battle-hardened sentinel, low firm alto voice, steady and commanding, terse, controlled intensity, mature and strong, not girlish.
    test_lines:
      - Враги подбираются к деревне с севера.
      - Действуй быстро и не теряй бдительности.

  - voice_id: nightelf-female-priestess
    revision: "1"
    sex: female
    description: Жрица Луны, спокойная, светлая, мелодичная, торжественная без пафоса.
    design_prompt: Female moon priestess, serene and luminous, melodic soprano, solemn without being theatrical.
    test_lines:
      - Свет луны укажет тебе дорогу даже в самой тёмной ночи.
      - Не бойся, ты не один в этом пути.

  - voice_id: satyr-male
    revision: "1"
    sex: male
    description: Сатир, хитрый, насмешливый, хрипловатый, с ухмылкой в голосе.
    design_prompt: Male satyr trickster, raspy and sly, mocking tone, grinning, playful menace.
    test_lines:
      - Ха-ха! Хорошая работёнка, ничего не скажешь!
      - Кто бы мог подумать, что ты так легко согласишься помочь.

  - voice_id: dryad-female
    revision: "1"
    sex: female
    description: Дриада — молодая девушка, полная энергии; звонкий, живой, уверенный голос, не детский.
    design_prompt: Young adult woman full of energy, bright ringing clear voice, lively and enthusiastic, confident and warm, mid-range pitch, not childish, not a little girl.
    test_lines:
      - Я вижу, тебе удалось найти меня!
      - Лес шепчет о тебе с самого утра.

  - voice_id: narrator
    revision: "1"
    sex: any
    description: Рассказчик для предметов и объектов — мудрый старец-сказитель в духе Гэндальфа; глубокий тёплый голос, неспешно.
    design_prompt: Wise old man storyteller, deep warm slightly gravelly bass voice, slow and deliberate narration, gentle authority, like an ancient wizard telling a legend by the fire.
    test_lines:
      - На камне выбиты древние руны.
      - Надпись почти стёрлась, но её ещё можно прочесть.

casting:
  npcs:
    creature:2150: satyr-male          # Зенн Грязное Копыто — раса модели неизвестна
    creature:3516: nightelf-male-elder # Верховный друид Фэндрал Олений Шлем
    creature:1992: dryad-female        # Тариндрелла — дриада, раса модели неизвестна
  archetypes:
    - match: Часовой
      race: 4
      sex: female
      voice: nightelf-female-sentinel
    - match: Жрица Луны
      race: 4
      sex: female
      voice: nightelf-female-priestess
    - match: друид
      race: 4
      sex: male
      voice: nightelf-male-elder
  race_sex:
    4:male: nightelf-male-calm
    4:female: nightelf-female-calm
  narrator: narrator
  unknown_creature: block   # block — без голоса не синтезируем; narrator — читать рассказчиком
